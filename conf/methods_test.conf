# Configuration to test method restrictions
# /get-only allows only GET
# /post-only allows only POST
# /all allows GET, POST, DELETE

server {
	listen 8080;
	server_name localhost;
	root www;
	index index.html;
	client_max_body_size 10M;

	error_page 404 www/error/404.html;
	error_page 405 www/error/405.html;

	location / {
		root www;
		index index.html;
		methods GET;
	}

	location /upload {
		root www/upload;
		methods GET POST DELETE;
		upload_dir www/upload;
	}

	location /cgi-bin {
		root www/cgi-bin;
		methods GET POST;
		cgi .py /usr/bin/python3;
	}

	location /listing {
		root www/listing;
		autoindex on;
		methods GET;
	}

	location /redirect {
		return 301 http://localhost:8080/;
	}
}
