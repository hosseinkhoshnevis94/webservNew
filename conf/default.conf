# Default Webserv configuration

server {
	listen 8080;
	server_name localhost;
	root www;
	index index.html;
	client_max_body_size 10M;

	error_page 400 www/error/400.html;
	error_page 403 www/error/403.html;
	error_page 404 www/error/404.html;
	error_page 405 www/error/405.html;
	error_page 413 www/error/413.html;
	error_page 500 www/error/500.html;

	location / {
		root www;
		index index.html;
		methods GET POST;
		autoindex off;
	}

	location /upload {
		root www/upload;
		methods GET POST DELETE;
		upload_dir www/upload;
		client_max_body_size 10M;
	}

	location /cgi-bin {
		root www/cgi-bin;
		methods GET POST;
		cgi .py /usr/bin/python3;
	}

	location /redirect {
		return 301 http://localhost:8080/;
	}

	location /listing {
		root www/listing;
		autoindex on;
		methods GET;
	}

	location /delete_test {
		root www/upload;
		methods GET DELETE;
	}
}

# Second server on different port (eval: multiple ports)
server {
	listen 8081;
	server_name localhost;
	root www/site2;
	index index.html;
	client_max_body_size 5M;

	error_page 404 www/error/404.html;

	location / {
		root www/site2;
		index index.html;
		methods GET;
	}
}

# Third server on same port 8080 but different server_name (eval: virtual hosts)
server {
	listen 8080;
	server_name example.com;
	root www/site3;
	index index.html;
	client_max_body_size 2M;

	location / {
		root www/site3;
		index index.html;
		methods GET POST;
	}
}
