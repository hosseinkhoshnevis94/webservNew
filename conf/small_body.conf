# Configuration to test client_max_body_size with a small limit (100 bytes)
# Usage: curl -X POST -H "Content-Type: plain/text" --data "short" http://localhost:8080/upload
# Should succeed (5 bytes < 100 bytes)
#
# Usage: curl -X POST -H "Content-Type: plain/text" --data "AAAA...200 chars..." http://localhost:8080/upload
# Should fail with 413 Payload Too Large (>100 bytes)

server {
	listen 8080;
	server_name localhost;
	root www;
	index index.html;
	client_max_body_size 100;

	error_page 400 www/error/400.html;
	error_page 403 www/error/403.html;
	error_page 404 www/error/404.html;
	error_page 405 www/error/405.html;
	error_page 413 www/error/413.html;
	error_page 500 www/error/500.html;

	location / {
		root www;
		index index.html;
		methods GET POST;
	}

	location /upload {
		root www/upload;
		methods GET POST DELETE;
		upload_dir www/upload;
		client_max_body_size 100;
	}

	location /cgi-bin {
		root www/cgi-bin;
		methods GET POST;
		cgi .py /usr/bin/python3;
	}
}
